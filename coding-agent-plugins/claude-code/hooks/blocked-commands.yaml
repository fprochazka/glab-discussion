# Rules for `bash-classify match`, used by block-glab-api-discussions.sh.
# Schema: https://github.com/fprochazka/bash-classify/schemas/match-rules.schema.json
#
# The shapes the glab-discussion PreToolUse hook denies: reading or writing merge
# request discussions, notes and draft notes through the raw API or through glab's own commands.
# Agents are meant to use the glab-discussion CLI instead.
#
# `command` is a prefix match on the *resolved* command path, so a wrapper
# (`sudo`, `timeout`, `bash -c`, `xargs`, `eval`) or an absolute binary path does not
# evade a rule, while a heredoc body or an `echo` string that merely names one of these
# commands is not an invocation and does not match.
rules:
  # Exactly the MR routes glab-discussion replaces: notes, discussions and their notes,
  # draft notes and their publish actions. The pattern is anchored at the end of the path,
  # so the routes below a note, `notes/:id/award_emoji` (reactions), stay allowed —
  # glab-discussion has no command for them. block-glab-api-discussions.sh uses the same
  # pattern in its text fallback; change both together.
  - name: mr-discussions-api
    command: [glab, api]
    any_arg_matches: 'merge_requests/[^/?]+/(notes(/[0-9]+)?|discussions(/[^/?]+(/notes(/[0-9]+)?)?)?|draft_notes(/bulk_publish|/[0-9]+(/publish)?)?)/?(\?|$)'

  # `--resolved` and `--unresolved` imply `--comments` (glab 1.116.0), so they read the
  # discussion threads just as much as the flag they imply.
  - name: mr-view-comments
    command: [glab, mr, view]
    any_option: [--comments, -c, --resolved, --unresolved]

  - name: mr-note
    command: [glab, mr, note]
    except: [[glab, mr, note, list]]
